name: TOH Playout Regression

on:
  push:
    branches:
      - 'fix/toh-*'
      - dev
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - '.github/workflows/toh-playout-regression.yml'

permissions:
  contents: read

jobs:
  open-hour-held-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PR 160 continuity is now paired with a fresh-source hold
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'azuracast.hold_clean_cut_fresh_source(new.source)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.broadcast_clock_cross_source = radio' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'source.tracks(azuracast.broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.tracks(radio_before_top_of_hour)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

      - name: Generate deterministic test audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          RATE = 44100

          def write_segments(path, segments):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(RATE)
                  for hz, seconds in segments:
                      for i in range(int(RATE * seconds)):
                          s = int(10000 * math.sin(2 * math.pi * hz * i / RATE))
                          f.writeframesraw(struct.pack('<hh', s, s))

          write_segments('/tmp/toh_old.wav', [(440, 20.0)])
          write_segments('/tmp/toh_fresh.wav', [(880, 1.0), (660, 19.0)])
          write_segments('/tmp/toh_third.wav', [(990, 20.0)])
          PY
          rm -rf /tmp/toh_open_out
          mkdir -p /tmp/toh_open_out
          chmod 0777 /tmp/toh_open_out

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run open-hour production-shaped held clean cut
        shell: bash
        run: |
          cat > /tmp/toh_open_regression.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          cut_target = ref(0.)
          id_active = ref(false)
          clean_cut_pending = ref(false)
          fresh_hold = ref(false)

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD",song_id="old":/tmp/toh_old.wav')
            elsif i == 1 then
              request.create('annotate:title="FRESH",song_id="fresh":/tmp/toh_fresh.wav')
            else
              request.create('annotate:title="THIRD",song_id="third":/tmp/toh_third.wav')
            end
          end

          dynamic = request.dynamic(
            id="next_song_test",
            timeout=5.,
            retry_delay=0.1,
            next_song
          )

          def dynamic_track(m) =
            title = list.assoc(default="", "title", m)
            log("TOH_OPEN_DYNAMIC_TRACK=#{title}")
            if title == "OLD" and cut_target() == 0. then
              cut_target := time() + 3.0
            end
          end
          source.methods(dynamic).on_track(synchronous=true, dynamic_track)

          music = fallback(
            id="dynamic_startup_test",
            track_sensitive=false,
            [dynamic, blank(id="startup_blank")]
          )
          music = stretch(ratio=1.0, music)

          def hold_fresh(s) =
            hold_blank = blank()
            switch(
              track_sensitive=false,
              replay_metadata=true,
              transition_length=0.0,
              [({ not fresh_hold() }, s), ({ true }, hold_blank)]
            )
          end

          def test_cross(old, new) =
            old_title = list.assoc(default="", "title", old.metadata)
            new_title = list.assoc(default="", "title", new.metadata)
            log("TOH_OPEN_CROSS old=#{old_title} new=#{new_title}")

            if clean_cut_pending() then
              clean_cut_pending := false
              log("TOH_OPEN_CROSS clean-cut consumed; fresh parked=#{fresh_hold()}")
              hold_fresh(new.source)
            else
              cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
            end
          end
          music = cross(id="production_cross_test", duration=5.0, test_cross, music)
          radio_before_toh = amplify(1.0, music)

          let {audio=underlay_audio, ...underlay_non_audio} = source.tracks(music)
          ignore(underlay_non_audio)
          muted_underlay = source({audio=underlay_audio})
          muted_underlay = amplify(0.0, muted_underlay)

          legal_id = sine(id="legal_id_test", duration=3.0, 1200.)
          legal_id_clocked = add(
            id="legal_id_clocked_test",
            normalize=false,
            [legal_id, muted_underlay]
          )

          def id_due() =
            target = cut_target()
            if id_active() then
              legal_id.is_ready()
            else
              target > 0. and time() >= target and time() < target + 4.0 and legal_id.is_ready()
            end
          end

          def enter_id(_, new) =
            id_active := true
            fresh_hold := true
            clean_cut_pending := true
            source.skip(dynamic)
            log("TOH_OPEN_ENTER held clean-cut armed")
            new
          end

          def leave_id(_, new) =
            fresh_hold := false
            id_active := false
            log("TOH_OPEN_EXIT fresh hold released")
            new
          end

          radio = switch(
            id="toh_open_switch",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter_id, leave_id],
            [({id_due()}, legal_id_clocked), ({true}, radio_before_toh)]
          )

          output.file(
            %wav(header=false, samplesize=16),
            "/out/output.pcm",
            fallible=true,
            radio
          )
          EOF

          set +e
          timeout -k 2s 14s docker run --rm \
            -v /tmp/toh_open_regression.liq:/tmp/toh_open_regression.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            -v /tmp/toh_third.wav:/tmp/toh_third.wav:ro \
            -v /tmp/toh_open_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_open_regression.liq \
            > /tmp/toh_open_regression.log 2>&1
          status=$?
          set -e

          cat /tmp/toh_open_regression.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            exit "$status"
          fi

          grep -q 'TOH_OPEN_DYNAMIC_TRACK=OLD' /tmp/toh_open_regression.log
          grep -q 'TOH_OPEN_ENTER held clean-cut armed' /tmp/toh_open_regression.log
          grep -q 'TOH_OPEN_CROSS clean-cut consumed; fresh parked=true' /tmp/toh_open_regression.log
          grep -q 'TOH_OPEN_EXIT fresh hold released' /tmp/toh_open_regression.log
          test -s /tmp/toh_open_out/output.pcm

      - name: Assert zero OLD leak and FRESH starts from opening
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import pathlib
          import struct

          raw = pathlib.Path('/tmp/toh_open_out/output.pcm').read_bytes()
          vals = struct.unpack('<' + 'h' * (len(raw) // 2), raw[:len(raw) // 2 * 2])
          samples = vals[0::2]
          rate = 44100
          win = int(rate * 0.02)
          hop = int(rate * 0.005)

          def goertzel(xs, freq):
              omega = 2.0 * math.pi * freq / rate
              coeff = 2.0 * math.cos(omega)
              s1 = s2 = 0.0
              for x in xs:
                  s0 = x + coeff * s1 - s2
                  s2, s1 = s1, s0
              return (s1*s1 + s2*s2 - coeff*s1*s2) / max(1, len(xs)*len(xs))

          rows = []
          for start in range(0, len(samples)-win+1, hop):
              xs = samples[start:start+win]
              powers = [goertzel(xs, f) for f in (440., 660., 880., 990., 1200.)]
              rms = math.sqrt(sum(float(x)*float(x) for x in xs)/len(xs))
              rows.append((start/rate, *powers, rms))

          ids = [r for r in rows if r[5] > 15*(r[1]+r[2]+r[3]+r[4]+1) and r[5] > 1e5]
          if not ids:
              raise SystemExit('OPEN_FAIL: legal ID not found')
          id_end = max(r[0] for r in ids) + win/rate
          post = [r for r in rows if id_end + 0.005 <= r[0] <= id_end + 1.7]

          old = [r for r in post if r[1] > 1e5 and r[1] > 0.08*(r[2]+r[3]+r[4]+r[5]+1)]
          if old:
              raise SystemExit(f'OPEN_FAIL: OLD leaked after ID at {old[0][0]:.3f}s')

          immediate = [r for r in post if r[0] <= id_end + 0.08]
          if not any(r[3] > 1e5 and r[3] > 4*(r[1]+r[2]+r[4]+r[5]+1) for r in immediate):
              raise SystemExit('OPEN_FAIL: FRESH opening did not begin immediately after ID')

          intro = [r for r in post if id_end + 0.10 <= r[0] <= id_end + 0.70]
          if not any(r[3] > 1e5 and r[3] > 4*(r[1]+r[2]+r[4]+r[5]+1) for r in intro):
              raise SystemExit('OPEN_FAIL: 880 Hz opening was consumed under ID')

          body = [r for r in post if id_end + 1.05 <= r[0] <= id_end + 1.55]
          if not any(r[2] > 1e5 and r[2] > 4*(r[1]+r[3]+r[4]+r[5]+1) for r in body):
              raise SystemExit('OPEN_FAIL: FRESH did not advance normally after release')

          if any(r[4] > 1e5 for r in post):
              raise SystemExit('OPEN_FAIL: THIRD appeared from a double skip')

          print('OPEN_PASS: OLD permanently gone; FRESH starts at opening; no hidden advance or double skip')
          PY

  hard-hour-rigid-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic hard-hour audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math, struct, wave
          RATE=44100
          def w(path, segs):
              with wave.open(path,'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(RATE)
                  for hz, sec in segs:
                      for i in range(int(RATE*sec)):
                          s=int(10000*math.sin(2*math.pi*hz*i/RATE))
                          f.writeframesraw(struct.pack('<hh',s,s))
          w('/tmp/hard_old.wav',[(440,20)])
          w('/tmp/hard_fresh.wav',[(880,1),(660,19)])
          w('/tmp/hard_third.wav',[(990,20)])
          PY
          rm -rf /tmp/toh_hard_out
          mkdir -p /tmp/toh_hard_out
          chmod 0777 /tmp/toh_hard_out

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run HARD TOH into rigid programme
        shell: bash
        run: |
          cat > /tmp/toh_hard_regression.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index=ref(0)
          target=ref(0.)
          boundary=ref(0.)
          toh_active=ref(false)
          clean_pending=ref(false)
          fresh_hold=ref(false)
          hard_handoff_epoch=ref(0.)

          def next_song() =
            i=request_index(); request_index:=i+1
            if i==0 then request.create('annotate:title="OLD":/tmp/hard_old.wav')
            elsif i==1 then request.create('annotate:title="FRESH":/tmp/hard_fresh.wav')
            else request.create('annotate:title="THIRD":/tmp/hard_third.wav') end
          end
          dynamic=request.dynamic(id="hard_dynamic",timeout=5.,retry_delay=0.1,next_song)
          def on_track(m)=
            title=list.assoc(default="","title",m)
            if title=="OLD" and target()==0. then
              target:=time()+3.0
              boundary:=target()+4.0
              log("HARD_TIMES target=#{target()} boundary=#{boundary()}")
            end
          end
          source.methods(dynamic).on_track(synchronous=true,on_track)
          music=fallback(track_sensitive=false,[dynamic,blank()])
          music=stretch(ratio=1.0,music)

          def held(s)=
            b=blank()
            switch(track_sensitive=false,replay_metadata=true,transition_length=0.,[({not fresh_hold()},s),({true},b)])
          end
          def xfade(old,new)=
            if clean_pending() then
              clean_pending:=false
              log("HARD_CROSS clean-cut consumed")
              held(new.source)
            else
              cross.simple(old.source,new.source,fade_in=1.,fade_out=1.)
            end
          end
          music=cross(duration=5.,xfade,music)

          rigid=sine(id="rigid_program",duration=2.0,1500.)
          rigid_active=ref(false)
          def rigid_due()=
            b=boundary()
            b>0. and time()>=b and time()<b+2.2 and rigid.is_ready()
          end
          def rigid_enter(_,new)=
            rigid_active:=true
            now=time(); h=hard_handoff_epoch()
            if h>0. and now>=h-1. and now<=h+2. then
              hard_handoff_epoch:=0.
              log("HARD_RIGID_HANDOFF_NO_SECOND_CUT")
            else
              hard_handoff_epoch:=0.
              clean_pending:=true
              source.skip(dynamic)
              log("HARD_RIGID_SECOND_CUT")
            end
            new
          end
          def rigid_exit(_,new)=
            rigid_active:=false
            log("HARD_RIGID_EXIT")
            new
          end
          radio_before_toh=switch(
            id="hard_rigid_switch",track_sensitive=false,replay_metadata=true,transition_length=0.,
            transitions=[rigid_enter,rigid_exit],
            [({rigid_due()},rigid),({true},music)]
          )

          let {audio=u_audio,...u_non_audio}=source.tracks(music)
          ignore(u_non_audio)
          muted=source({audio=u_audio})
          muted=amplify(0.,muted)

          legal=sine(id="hard_legal",duration=2.0,1200.)
          hard_blank=blank()
          legal_lane=fallback(track_sensitive=false,transition_length=0.,[legal,hard_blank])
          clocked_lane=add(normalize=false,[legal_lane,muted])

          def toh_due()=
            t=target(); b=boundary()
            if toh_active() then b>0. and time()<b
            else t>0. and time()>=t and time()<b and legal.is_ready() end
          end
          def toh_enter(_,new)=
            toh_active:=true
            fresh_hold:=true
            hard_handoff_epoch:=boundary()
            clean_pending:=true
            source.skip(dynamic)
            log("HARD_TOH_ENTER")
            new
          end
          def toh_exit(_,new)=
            fresh_hold:=false
            toh_active:=false
            log("HARD_TOH_EXIT_AT_BOUNDARY")
            new
          end
          radio=switch(
            id="hard_toh_switch",track_sensitive=false,replay_metadata=true,transition_length=0.,
            transitions=[toh_enter,toh_exit],
            [({toh_due()},clocked_lane),({true},radio_before_toh)]
          )
          output.file(%wav(header=false,samplesize=16),"/out/output.pcm",fallible=true,radio)
          EOF

          set +e
          timeout -k 2s 16s docker run --rm \
            -v /tmp/toh_hard_regression.liq:/tmp/toh_hard_regression.liq:ro \
            -v /tmp/hard_old.wav:/tmp/hard_old.wav:ro \
            -v /tmp/hard_fresh.wav:/tmp/hard_fresh.wav:ro \
            -v /tmp/hard_third.wav:/tmp/hard_third.wav:ro \
            -v /tmp/toh_hard_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_hard_regression.liq \
            > /tmp/toh_hard_regression.log 2>&1
          status=$?
          set -e
          cat /tmp/toh_hard_regression.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi

          grep -q 'HARD_TOH_ENTER' /tmp/toh_hard_regression.log
          grep -q 'HARD_CROSS clean-cut consumed' /tmp/toh_hard_regression.log
          grep -q 'HARD_TOH_EXIT_AT_BOUNDARY' /tmp/toh_hard_regression.log
          grep -q 'HARD_RIGID_HANDOFF_NO_SECOND_CUT' /tmp/toh_hard_regression.log
          ! grep -q 'HARD_RIGID_SECOND_CUT' /tmp/toh_hard_regression.log
          test -s /tmp/toh_hard_out/output.pcm

      - name: Assert rigid owns boundary and parked FRESH survives
        shell: bash
        run: |
          python3 - <<'PY'
          import math, pathlib, struct
          raw=pathlib.Path('/tmp/toh_hard_out/output.pcm').read_bytes()
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw[:len(raw)//2*2])
          s=vals[0::2]; rate=44100; win=int(rate*.02); hop=int(rate*.005)
          freqs=(440.,660.,880.,990.,1200.,1500.)
          def g(xs,f):
              o=2*math.pi*f/rate; c=2*math.cos(o); a=b=0.
              for x in xs:
                  z=x+c*a-b; b,a=a,z
              return (a*a+b*b-c*a*b)/max(1,len(xs)*len(xs))
          rows=[]
          for st in range(0,len(s)-win+1,hop):
              xs=s[st:st+win]; p=[g(xs,f) for f in freqs]
              rows.append((st/rate,*p))
          ids=[r for r in rows if r[5]>15*(r[1]+r[2]+r[3]+r[4]+r[6]+1) and r[5]>1e5]
          rig=[r for r in rows if r[6]>15*(r[1]+r[2]+r[3]+r[4]+r[5]+1) and r[6]>1e5]
          if not ids or not rig: raise SystemExit('HARD_FAIL: ID or rigid programme missing')
          id_end=max(r[0] for r in ids)+win/rate
          rigid_start=min(r[0] for r in rig)
          if not (1.75 <= rigid_start-id_end <= 2.25):
              raise SystemExit(f'HARD_FAIL: rigid did not take the exact reserved boundary; gap={rigid_start-id_end:.3f}s')
          after_id=[r for r in rows if id_end<=r[0]<=rigid_start+2.8]
          if any(r[1]>1e5 and r[1]>.08*(sum(r[2:])+1) for r in after_id):
              raise SystemExit('HARD_FAIL: OLD returned after legal ID')
          between=[r for r in rows if id_end+.05<=r[0]<=rigid_start-.05]
          if any(max(r[2],r[3],r[4])>1e5 for r in between):
              raise SystemExit('HARD_FAIL: ordinary AutoDJ leaked into hard-hold window')
          rigid_end=max(r[0] for r in rig)+win/rate
          post=[r for r in rows if rigid_end+.01<=r[0]<=rigid_end+.8]
          if not any(r[3]>1e5 and r[3]>4*(r[1]+r[2]+r[4]+r[5]+r[6]+1) for r in post):
              raise SystemExit('HARD_FAIL: parked FRESH opening was not preserved after rigid programme')
          if any(r[4]>1e5 for r in post):
              raise SystemExit('HARD_FAIL: THIRD appeared from a second cut')
          print('HARD_PASS: exact rigid boundary; no OLD leak; FRESH preserved; no second cut')
          PY
