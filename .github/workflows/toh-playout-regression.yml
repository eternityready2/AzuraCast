name: TOH Playout Regression

on:
  push:
    branches:
      - 'fix/toh-*'
      - dev
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - '.github/workflows/toh-playout-regression.yml'

permissions:
  contents: read

jobs:
  open-hour-pr160-cleanup-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'azuracast.broadcast_clock_cross_source = radio' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          ! grep -q 'def azuracast.live_aware_crossfade_impl' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.discard_autodj_current_cleanly()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'top_of_hour_cleanup_gate = switch(' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q '({azuracast.autodj_clean_cut_pending()}, top_of_hour_cleanup_audio)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

      - name: Generate deterministic audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          def write(path, segments):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(rate)
                  for hz, seconds in segments:
                      for i in range(int(rate * seconds)):
                          s = int(10000 * math.sin(2 * math.pi * hz * i / rate))
                          f.writeframesraw(struct.pack('<hh', s, s))
          write('/tmp/toh_old.wav', [(440, 20.0)])
          write('/tmp/toh_fresh.wav', [(880, 1.0), (660, 19.0)])
          write('/tmp/toh_third.wav', [(990, 20.0)])
          PY
          rm -rf /tmp/toh_open_out && mkdir -p /tmp/toh_open_out && chmod 0777 /tmp/toh_open_out

      - name: Pull Liquidsoap 2.4.5
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run production-shaped open-hour clean cut
        shell: bash
        run: |
          cat > /tmp/toh_open.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          target = ref(0.)
          id_active = ref(false)
          clean_pending = ref(false)

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then request.create('annotate:title="OLD":/tmp/toh_old.wav')
            elsif i == 1 then request.create('annotate:title="FRESH":/tmp/toh_fresh.wav')
            else request.create('annotate:title="THIRD":/tmp/toh_third.wav') end
          end

          dynamic = request.dynamic(id="open_dynamic", timeout=5., retry_delay=0.1, next_song)
          def track_started(m) =
            title = list.assoc(default="", "title", m)
            log("OPEN_TRACK=#{title}")
            if title == "OLD" and target() == 0. then target := time() + 3.0 end
          end
          source.methods(dynamic).on_track(synchronous=true, track_started)

          base = fallback(track_sensitive=false, [dynamic, blank(id="open_start_blank")])
          base = stretch(ratio=1.0, base)

          def xfade(old, new) =
            old_title = list.assoc(default="", "title", old.metadata)
            new_title = list.assoc(default="", "title", new.metadata)
            log("OPEN_CROSS old=#{old_title} new=#{new_title}")
            if clean_pending() then
              clean_pending := false
              log("OPEN_CLEAN_CONSUMED")
              new.source
            else
              cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
            end
          end
          music = cross(id="open_cross", duration=5.0, xfade, base)
          radio_before_toh = amplify(1.0, music)

          # This is the production #164 design: gate the WHOLE post-cross source,
          # not new.source inside the cross callback.
          let {audio=cleanup_audio_track, ...cleanup_non_audio} = source.tracks(music)
          ignore(cleanup_non_audio)
          cleanup_audio = source({audio=cleanup_audio_track})
          cleanup_audio = amplify(0.0, cleanup_audio)
          cleanup_idle = blank(id="open_cleanup_idle")
          cleanup_gate = switch(
            id="open_cleanup_gate",
            track_sensitive=false,
            replay_metadata=false,
            transition_length=0.0,
            [({clean_pending()}, cleanup_audio), ({true}, cleanup_idle)]
          )

          legal = sine(id="open_legal", duration=3.0, 1200.)
          legal_clocked = add(normalize=false, [legal, cleanup_gate])

          def due() =
            t = target()
            if id_active() then legal.is_ready()
            else t > 0. and time() >= t and time() < t + 4.0 and legal.is_ready() end
          end

          def enter(_, new) =
            id_active := true
            clean_pending := true
            source.skip(dynamic)
            log("OPEN_ENTER")
            new
          end
          def leave(_, new) =
            id_active := false
            log("OPEN_EXIT pending=#{clean_pending()}")
            new
          end

          radio = switch(
            id="open_toh",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter, leave],
            [({due()}, legal_clocked), ({true}, radio_before_toh)]
          )
          output.file(%wav(header=false, samplesize=16), "/out/output.pcm", fallible=true, radio)
          EOF

          set +e
          timeout -k 2s 14s docker run --rm \
            -v /tmp/toh_open.liq:/tmp/toh_open.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            -v /tmp/toh_third.wav:/tmp/toh_third.wav:ro \
            -v /tmp/toh_open_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_open.liq > /tmp/toh_open.log 2>&1
          status=$?
          set -e
          cat /tmp/toh_open.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          grep -q 'OPEN_ENTER' /tmp/toh_open.log
          grep -q 'OPEN_CLEAN_CONSUMED' /tmp/toh_open.log
          grep -q 'OPEN_EXIT pending=false' /tmp/toh_open.log
          test -s /tmp/toh_open_out/output.pcm

      - name: Assert OLD gone, FRESH opening preserved, no dead air or double skip
        shell: bash
        run: |
          python3 - <<'PY'
          import math, pathlib, struct
          raw = pathlib.Path('/tmp/toh_open_out/output.pcm').read_bytes()
          vals = struct.unpack('<' + 'h' * (len(raw)//2), raw[:len(raw)//2*2])
          samples = vals[0::2]
          rate = 44100; win = int(rate*.02); hop = int(rate*.005)
          freqs = (440., 660., 880., 990., 1200.)
          def power(xs, f):
              o=2*math.pi*f/rate; c=2*math.cos(o); a=b=0.
              for x in xs:
                  z=x+c*a-b; b,a=a,z
              return (a*a+b*b-c*a*b)/max(1,len(xs)*len(xs))
          rows=[]
          for st in range(0,len(samples)-win+1,hop):
              xs=samples[st:st+win]; p=[power(xs,f) for f in freqs]
              rms=math.sqrt(sum(float(x)*float(x) for x in xs)/len(xs))
              rows.append((st/rate,*p,rms))
          ids=[r for r in rows if r[5]>15*(r[1]+r[2]+r[3]+r[4]+1) and r[5]>1e5]
          if not ids: raise SystemExit('OPEN_FAIL: ID missing')
          id_end=max(r[0] for r in ids)+win/rate
          post=[r for r in rows if id_end+.005<=r[0]<=id_end+1.7]
          if any(r[1]>1e5 and r[1]>.08*(r[2]+r[3]+r[4]+r[5]+1) for r in post):
              raise SystemExit('OPEN_FAIL: OLD leaked after ID')
          first=[r for r in post if r[0]<=id_end+.12]
          if not any(r[3]>1e5 and r[3]>4*(r[1]+r[2]+r[4]+r[5]+1) for r in first):
              raise SystemExit('OPEN_FAIL: no immediate FRESH opening after ID')
          intro=[r for r in post if id_end+.15<=r[0]<=id_end+.75]
          if not any(r[3]>1e5 and r[3]>4*(r[1]+r[2]+r[4]+r[5]+1) for r in intro):
              raise SystemExit('OPEN_FAIL: FRESH opening advanced under ID')
          body=[r for r in post if id_end+1.05<=r[0]<=id_end+1.55]
          if not any(r[2]>1e5 and r[2]>4*(r[1]+r[3]+r[4]+r[5]+1) for r in body):
              raise SystemExit('OPEN_FAIL: FRESH did not advance after release')
          if any(r[4]>1e5 for r in post): raise SystemExit('OPEN_FAIL: THIRD appeared from double skip')
          audible=[r for r in post if r[0]<=id_end+.15 and r[6]>1000]
          if not audible: raise SystemExit('OPEN_FAIL: dead air after ID')
          print('OPEN_PASS')
          PY

  hard-hour-rigid-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate=44100
          def write(path,segs):
              with wave.open(path,'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(rate)
                  for hz,sec in segs:
                      for i in range(int(rate*sec)):
                          s=int(10000*math.sin(2*math.pi*hz*i/rate)); f.writeframesraw(struct.pack('<hh',s,s))
          write('/tmp/hard_old.wav',[(440,20)])
          write('/tmp/hard_fresh.wav',[(880,1),(660,19)])
          write('/tmp/hard_third.wav',[(990,20)])
          PY
          rm -rf /tmp/toh_hard_out && mkdir -p /tmp/toh_hard_out && chmod 0777 /tmp/toh_hard_out

      - name: Pull Liquidsoap 2.4.5
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run HARD TOH through exact rigid handoff
        shell: bash
        run: |
          cat > /tmp/toh_hard.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          idx=ref(0); target=ref(0.); boundary=ref(0.); toh_active=ref(false); pending=ref(false); handoff=ref(0.)
          def next_song() =
            i=idx(); idx:=i+1
            if i==0 then request.create('annotate:title="OLD":/tmp/hard_old.wav')
            elsif i==1 then request.create('annotate:title="FRESH":/tmp/hard_fresh.wav')
            else request.create('annotate:title="THIRD":/tmp/hard_third.wav') end
          end
          dynamic=request.dynamic(id="hard_dynamic",timeout=5.,retry_delay=0.1,next_song)
          def started(m)=
            title=list.assoc(default="","title",m)
            if title=="OLD" and target()==0. then target:=time()+3.; boundary:=target()+4. end
          end
          source.methods(dynamic).on_track(synchronous=true,started)
          base=fallback(track_sensitive=false,[dynamic,blank()]); base=stretch(ratio=1.,base)
          def xfade(old,new)=
            if pending() then pending:=false; log("HARD_CLEAN_CONSUMED"); new.source
            else cross.simple(old.source,new.source,fade_in=1.,fade_out=1.) end
          end
          music=cross(id="hard_cross",duration=5.,xfade,base)

          rigid=sine(id="rigid_program",duration=2.,1500.)
          def rigid_due()= b=boundary(); b>0. and time()>=b and time()<b+2.2 and rigid.is_ready() end
          def rigid_enter(_,new)=
            now=time(); h=handoff()
            if h>0. and now>=h-1. and now<=h+2. then
              handoff:=0.; log("HARD_RIGID_NO_SECOND_CUT")
            else
              handoff:=0.; pending:=true; source.skip(dynamic); log("HARD_RIGID_SECOND_CUT")
            end
            new
          end
          def rigid_exit(_,new)= log("HARD_RIGID_EXIT"); new end
          radio_before_toh=switch(
            id="hard_rigid",track_sensitive=false,replay_metadata=true,transition_length=0.,
            transitions=[rigid_enter,rigid_exit],
            [({rigid_due()},rigid),({true},music)]
          )

          # Cleanup capture is the post-cross source only, below rigid scheduling.
          let {audio=ca,...cn}=source.tracks(music)
          ignore(cn)
          cleanup=source({audio=ca}); cleanup=amplify(0.,cleanup)
          cleanup_gate=switch(track_sensitive=false,replay_metadata=false,transition_length=0.,[({pending()},cleanup),({true},blank())])

          legal=sine(id="hard_legal",duration=2.,1200.)
          hard_hold=blank(id="hard_hold")
          legal_lane=fallback(track_sensitive=false,transition_length=0.,[legal,hard_hold])
          clocked=add(normalize=false,[legal_lane,cleanup_gate])
          def toh_due()=
            t=target(); b=boundary()
            if toh_active() then b>0. and time()<b
            else t>0. and time()>=t and time()<b and legal.is_ready() end
          end
          def toh_enter(_,new)=
            toh_active:=true; handoff:=boundary(); pending:=true; source.skip(dynamic); log("HARD_TOH_ENTER"); new
          end
          def toh_exit(_,new)= toh_active:=false; log("HARD_TOH_EXIT pending=#{pending()}"); new end
          radio=switch(
            id="hard_toh",track_sensitive=false,replay_metadata=true,transition_length=0.,
            transitions=[toh_enter,toh_exit],
            [({toh_due()},clocked),({true},radio_before_toh)]
          )
          output.file(%wav(header=false,samplesize=16),"/out/output.pcm",fallible=true,radio)
          EOF

          set +e
          timeout -k 2s 16s docker run --rm \
            -v /tmp/toh_hard.liq:/tmp/toh_hard.liq:ro \
            -v /tmp/hard_old.wav:/tmp/hard_old.wav:ro \
            -v /tmp/hard_fresh.wav:/tmp/hard_fresh.wav:ro \
            -v /tmp/hard_third.wav:/tmp/hard_third.wav:ro \
            -v /tmp/toh_hard_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_hard.liq > /tmp/toh_hard.log 2>&1
          status=$?
          set -e
          cat /tmp/toh_hard.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          grep -q 'HARD_TOH_ENTER' /tmp/toh_hard.log
          grep -q 'HARD_CLEAN_CONSUMED' /tmp/toh_hard.log
          grep -q 'HARD_TOH_EXIT pending=false' /tmp/toh_hard.log
          grep -q 'HARD_RIGID_NO_SECOND_CUT' /tmp/toh_hard.log
          ! grep -q 'HARD_RIGID_SECOND_CUT' /tmp/toh_hard.log
          test -s /tmp/toh_hard_out/output.pcm

      - name: Assert hard hold, rigid authority, and preserved FRESH opening
        shell: bash
        run: |
          python3 - <<'PY'
          import math,pathlib,struct
          raw=pathlib.Path('/tmp/toh_hard_out/output.pcm').read_bytes(); vals=struct.unpack('<'+'h'*(len(raw)//2),raw[:len(raw)//2*2]); s=vals[0::2]
          rate=44100; win=int(rate*.02); hop=int(rate*.005); freqs=(440.,660.,880.,990.,1200.,1500.)
          def p(xs,f):
              o=2*math.pi*f/rate;c=2*math.cos(o);a=b=0.
              for x in xs:z=x+c*a-b;b,a=a,z
              return (a*a+b*b-c*a*b)/max(1,len(xs)*len(xs))
          rows=[]
          for st in range(0,len(s)-win+1,hop):
              xs=s[st:st+win]; rows.append((st/rate,*[p(xs,f) for f in freqs]))
          ids=[r for r in rows if r[5]>15*(r[1]+r[2]+r[3]+r[4]+r[6]+1) and r[5]>1e5]
          rig=[r for r in rows if r[6]>15*(r[1]+r[2]+r[3]+r[4]+r[5]+1) and r[6]>1e5]
          if not ids or not rig: raise SystemExit('HARD_FAIL: ID/rigid missing')
          id_end=max(r[0] for r in ids)+win/rate; rigid_start=min(r[0] for r in rig)
          if not 1.75<=rigid_start-id_end<=2.25: raise SystemExit(f'HARD_FAIL: wrong hard-hold gap {rigid_start-id_end:.3f}')
          between=[r for r in rows if id_end+.05<=r[0]<=rigid_start-.05]
          if any(max(r[1],r[2],r[3],r[4])>1e5 for r in between): raise SystemExit('HARD_FAIL: AutoDJ leaked into hard hold')
          rigid_end=max(r[0] for r in rig)+win/rate
          post=[r for r in rows if rigid_end+.005<=r[0]<=rigid_end+1.7]
          if any(r[1]>1e5 and r[1]>.08*(r[2]+r[3]+r[4]+r[5]+r[6]+1) for r in post): raise SystemExit('HARD_FAIL: OLD returned')
          intro=[r for r in post if rigid_end+.10<=r[0]<=rigid_end+.75]
          if not any(r[3]>1e5 and r[3]>4*(r[1]+r[2]+r[4]+r[5]+r[6]+1) for r in intro): raise SystemExit('HARD_FAIL: FRESH opening was consumed')
          if any(r[4]>1e5 for r in post): raise SystemExit('HARD_FAIL: THIRD from second cut')
          print('HARD_PASS')
          PY
