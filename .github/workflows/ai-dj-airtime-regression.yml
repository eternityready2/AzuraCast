name: AI DJ and Runtime Regression

on:
  push:
    branches:
      - 'fix/playlist-loop-labels-and-ai-dj-airtime'
      - 'fix/ai-dj-strict-lifecycle-sept14'
    paths:
      - 'backend/config/events.php'
      - 'backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php'
      - 'backend/src/Radio/AutoDJ/AiDjQueueListener.php'
      - 'backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php'
      - 'backend/src/Controller/Api/Stations/QueueController.php'
      - 'backend/src/Radio/Backend/Liquidsoap.php'
      - 'backend/src/Service/AiDjGenerator.php'
      - 'plugins/top_of_hour/src/AiDjRuntimeConfiguration.php'
      - 'util/docker/kokoro/kokoro_tts.py'
      - 'util/docker/web/scripts/piper'
      - 'util/docker/web/setup/piper.sh'
      - 'backend/src/MessageQueue/QueueManager.php'
      - 'backend/src/Radio/AbstractLocalAdapter.php'
      - 'backend/src/Sync/Task/QueueInterruptingTracks.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php'
      - 'backend/src/Radio/AutoDJ/Annotations.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Playlists/Form/ScheduleRow.vue'
      - 'tests/Unit/AiDjRuntimeCadenceTest.php'
      - '.github/workflows/ai-dj-airtime-regression.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/config/events.php'
      - 'backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php'
      - 'backend/src/Radio/AutoDJ/AiDjQueueListener.php'
      - 'backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php'
      - 'backend/src/Controller/Api/Stations/QueueController.php'
      - 'backend/src/Radio/Backend/Liquidsoap.php'
      - 'backend/src/Service/AiDjGenerator.php'
      - 'plugins/top_of_hour/src/AiDjRuntimeConfiguration.php'
      - 'util/docker/kokoro/kokoro_tts.py'
      - 'util/docker/web/scripts/piper'
      - 'util/docker/web/setup/piper.sh'
      - 'backend/src/MessageQueue/QueueManager.php'
      - 'backend/src/Radio/AbstractLocalAdapter.php'
      - 'backend/src/Sync/Task/QueueInterruptingTracks.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php'
      - 'backend/src/Radio/AutoDJ/Annotations.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Playlists/Form/ScheduleRow.vue'
      - 'tests/Unit/AiDjRuntimeCadenceTest.php'
      - '.github/workflows/ai-dj-airtime-regression.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          # AI DJ cadence is production-proven to run directly off real BuildQueue
          # song-boundary events (see main branch AiDjQueueListener, unchanged
          # architecture, 13-day production log averaging 5.0-5.7 breaks/hr).
          # Commit 782a069 removed these subscribers from events.php believing
          # synchronous TTS would block queue building; production runs the same
          # synchronous TTS calls directly in BuildQueue for 13+ days with no
          # reported stalls. Removing them collapsed dev's cadence from ~6/hr to
          # 0-1/hr because AiDjShiftLifecycleRuntimeTask's 1-minute cron alone
          # cannot reproduce the natural per-song-boundary cadence. All three
          # must stay registered; the wall-clock task remains ADDITIONALLY
          # responsible for welcome/sign-off reliability and Strict-playlist
          # catch-up talk, where no real BuildQueue event fires at all.
          grep -q 'App\\Sync\\Task\\AiDjShiftLifecycleRuntimeTask::class' backend/config/events.php
          grep -q 'App\\Radio\\AutoDJ\\AiDjQueueListener::class' backend/config/events.php
          grep -q 'App\\Radio\\AutoDJ\\AiDjShiftLifecycleListener::class' backend/config/events.php
          grep -q 'App\\Radio\\AutoDJ\\AiDjCadenceWatchdogSubscriber::class' backend/config/events.php

          # Wall-clock catch-up interval/ceiling recalibrated against the
          # production (main branch) 13-day log: Onyx averaged 5.67/hr (max
          # 7.67/hr), Bella averaged 5.00/hr (max 5.86/hr). 600s base interval
          # and an 8/hr ceiling reproduce those figures; the previous 270s/12hr
          # values were untested guesses that targeted far more talk than
          # production ever actually produces.
          grep -q 'TALK_BASE_INTERVAL_SECONDS = 600' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'MAX_TALK_BREAKS_PER_HOUR = 8' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'WELCOME_RECOVERY_SECONDS = 1800' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q '\$this->lifecycleListener->onBuildQueue(\$event);' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q '\$this->queueListener->onBuildQueue(\$event);' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'ai_dj_talk_cadence_' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'countRecentDjBreaks' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'findLatestSubmittedDjClip' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q '\$submittedNewClip' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q '\$airedNewClip' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'isRunning(\$station)' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'current_streamer' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php

          # Self-healing: a clip stuck pending in Liquidsoap past a reasonable
          # window (dead fallback gate, unresolved request, stale runtime state
          # from before a deploy) must be force-cleared automatically every
          # minute, not left silent until the next scheduled shift boundary.
          # The Upcoming Queue page must also stop trusting/displaying the same
          # stale pending row once it has clearly missed its air time, instead
          # of pinning it at the top indefinitely.
          grep -q 'clearStuckAiDjSpeech' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'STUCK_SPEECH_SECONDS' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'PENDING_AI_DJ_STALE_SECONDS' backend/src/Controller/Api/Stations/QueueController.php
          grep -q 'ai_dj_control.clear' backend/src/Controller/Api/Stations/QueueController.php

          # Stale speech is only purged from the dedicated AI DJ queue. Listener
          # Requests are never flushed, and concrete shift identity owns pending speech.
          grep -q 'purgePendingAiDjSpeech' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'ai_dj_runtime_shift_' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'ai_dj_control.clear' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'ai_dj_control.pending' backend/src/Radio/Backend/Liquidsoap.php
          grep -Fq "LiquidsoapQueues::AiDj->value . '.queue'" backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -Fq "sprintf('%s.remove %d', LiquidsoapQueues::AiDj->value" backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          ! grep -q 'Requests->value.*remove' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'source.is_ready(ai_dj_queue)' plugins/top_of_hour/src/AiDjRuntimeConfiguration.php
          grep -q 'ai_dj_queue.set_queue(\[\])' plugins/top_of_hour/src/AiDjRuntimeConfiguration.php
          grep -q 'ai_dj_queue.skip()' plugins/top_of_hour/src/AiDjRuntimeConfiguration.php

          # Cadence and lifecycle durability must reflect actual on-air speech, not
          # synthetic StationQueue rows that were merely submitted to Liquidsoap.
          grep -q 'use App\\Entity\\SongHistory;' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'SELECT sh FROM App\\Entity\\SongHistory sh' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q 'sh.timestamp_start' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          ! grep -q 'timestamp_played' backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          grep -q '\$queueEntry->is_played = true;' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q '\$queueEntry->timestamp_played = null;' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q '\$queueEntry->timestamp_played = null;' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q '\$alreadySignedOff = \$this->hasDurableShiftMarker' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          ! grep -q 'ai_dj_outro_' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php

          # Queue-planning lookahead must not silence normal AI DJ speech for 10-30
          # minutes. Only the real :54:30 airtime cutoff and news windows are speech
          # exclusions, and a request crossing into the next hour is always blocked.
          ! grep -q 'isInLookaheadZone' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'TOH_SPEECH_CUTOFF_SECONDS = 3270' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q '\$airSecondsIntoHour' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q '\$crossesHour' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          ! grep -q '\$minute >= 50' backend/src/Radio/AutoDJ/AiDjQueueListener.php

          # Dedicated speech lane must preserve old-config compatibility and never
          # interrupt a connected human live presenter.
          grep -q 'LiquidsoapQueues::AiDj === \$queue' backend/src/Radio/Backend/Liquidsoap.php
          grep -q 'LiquidsoapQueues::Requests->value' backend/src/Radio/Backend/Liquidsoap.php
          grep -q 'isUnknownCommandResponse' backend/src/Radio/Backend/Liquidsoap.php
          grep -q 'predicate.activates({ not azuracast.live_enabled() })' plugins/top_of_hour/src/AiDjRuntimeConfiguration.php
          grep -q 'ai_dj_available' plugins/top_of_hour/src/AiDjRuntimeConfiguration.php

          # Preserve the welcome, sign-off and artist-history paths the station uses.
          grep -q 'generateShiftIntro' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'AI DJ Welcome' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'generateShiftOutro' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q 'AI DJ Sign-off' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q 'AiDjArtistHistoryService' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'pushArtistHistoryClip' backend/src/Radio/AutoDJ/AiDjQueueListener.php

          # Kokoro remains on the branch baseline behavior; this PR does not change
          # voice selection or fallback policy.
          grep -q 'KOKORO_TIMEOUT_SECONDS = 35' util/docker/kokoro/kokoro_tts.py
          grep -q 'PIPER_TIMEOUT_SECONDS = 40' util/docker/kokoro/kokoro_tts.py
          grep -q 'KOKORO_CHUNK_CHARS = 260' util/docker/kokoro/kokoro_tts.py
          grep -q 'def split_text' util/docker/kokoro/kokoro_tts.py
          grep -q 'REAL_PIPER_BIN = "/usr/local/share/piper/piper"' util/docker/kokoro/kokoro_tts.py
          grep -q 'command = \[REAL_PIPER_BIN' util/docker/kokoro/kokoro_tts.py
          grep -q 'run_piper_fallback' util/docker/kokoro/kokoro_tts.py

          # Piper is owned by the production-log repair (#196). This AI-DJ branch
          # must remain compatible both before and after that PR is merged.
          grep -Eq 'PRIMARY_TIMEOUT_SECONDS = (55|65)' util/docker/web/scripts/piper
          grep -q 'RETRY_TIMEOUT_SECONDS = 20' util/docker/web/scripts/piper
          grep -q 'RETRY_MAX_CHARS = 800' util/docker/web/scripts/piper
          grep -q 'bounded_retry_text' util/docker/web/scripts/piper
          grep -q '/usr/local/bin/piper-real' util/docker/web/setup/piper.sh
          grep -q 'chmod a+x /usr/local/bin/piper' util/docker/web/setup/piper.sh

          # LOGS(7) runtime regressions.
          grep -q "XTRIM" backend/src/MessageQueue/QueueManager.php
          ! grep -q '\$connection->cleanup();' backend/src/MessageQueue/QueueManager.php
          grep -q 'if (!\$this->isRunning(\$station))' backend/src/Radio/AbstractLocalAdapter.php
          grep -q '\$this->start(\$station);' backend/src/Radio/AbstractLocalAdapter.php
          grep -q 'Interrupting queue skipped because Liquidsoap is not running' backend/src/Sync/Task/QueueInterruptingTracks.php
          grep -q 'Top-of-Hour staging skipped because Liquidsoap is not running' backend/src/Sync/Task/StageTopOfHourStationIdTask.php
          grep -q 'null === \$station->current_song' backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php
          grep -q "'azuracast_autocue' => false" backend/src/Radio/AutoDJ/Annotations.php

          # Requested playlist copy remains independent from Flexible/Strict timing.
          grep -q 'Play once per scheduled block — No Loop' frontend/components/Stations/Playlists/Form/ScheduleRow.vue
          grep -q 'Repeat until end of block — Loop' frontend/components/Stations/Playlists/Form/ScheduleRow.vue
          grep -q 'Priority Start — Override Requests' frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          grep -q 'Start on schedule and take priority over listener requests' frontend/components/Stations/Playlists/Form/PlayoutRules.vue

      - name: PHP syntax check
        run: |
          php -l backend/config/events.php
          php -l backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php
          php -l backend/src/Radio/AutoDJ/AiDjQueueListener.php
          php -l backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          php -l backend/src/Radio/Backend/Liquidsoap.php
          php -l plugins/top_of_hour/src/AiDjRuntimeConfiguration.php
          php -l backend/src/MessageQueue/QueueManager.php
          php -l backend/src/Radio/AbstractLocalAdapter.php
          php -l backend/src/Sync/Task/QueueInterruptingTracks.php
          php -l backend/src/Sync/Task/StageTopOfHourStationIdTask.php
          php -l backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php
          php -l backend/src/Radio/AutoDJ/Annotations.php
          php -l tests/Unit/AiDjRuntimeCadenceTest.php

      - name: TTS wrapper syntax check
        run: |
          python3 -m py_compile util/docker/kokoro/kokoro_tts.py util/docker/web/scripts/piper
          bash -n util/docker/web/setup/piper.sh

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute AI DJ cadence regression
        run: vendor/bin/codecept run tests/Unit/AiDjRuntimeCadenceTest.php

      - name: PHPStan runtime repairs
        shell: bash
        run: |
          cat > phpstan.ai-dj-airtime.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          # AiDjQueueListener is covered above by syntax and behavioral contracts.
          # It has four pre-existing static warnings unrelated to this repair; keep
          # this targeted PHPStan gate focused on files changed semantically here.
          vendor/bin/phpstan analyze -c phpstan.ai-dj-airtime.neon --memory-limit=-1 --no-progress \
            backend/src/Sync/Task/AiDjShiftLifecycleRuntimeTask.php \
            backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php \
            backend/src/Radio/Backend/Liquidsoap.php \
            plugins/top_of_hour/src/AiDjRuntimeConfiguration.php \
            backend/src/MessageQueue/QueueManager.php \
            backend/src/Radio/AbstractLocalAdapter.php \
            backend/src/Sync/Task/QueueInterruptingTracks.php \
            backend/src/Sync/Task/StageTopOfHourStationIdTask.php \
            backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php \
            backend/src/Radio/AutoDJ/Annotations.php \
            tests/Unit/AiDjRuntimeCadenceTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check playlist UI changes
        shell: bash
        run: |
          cat > tsconfig.ai-dj-airtime.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/Playlists/Form/PlayoutRules.vue",
              "frontend/components/Stations/Playlists/Form/ScheduleRow.vue"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.ai-dj-airtime.json --noEmit

      - name: Lint playlist UI changes
        run: >-
          npx eslint
          frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          frontend/components/Stations/Playlists/Form/ScheduleRow.vue
