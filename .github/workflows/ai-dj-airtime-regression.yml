name: AI DJ Airtime Regression

on:
  push:
    branches:
      - 'fix/playlist-loop-labels-and-ai-dj-airtime'
    paths:
      - 'backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php'
      - 'backend/src/Radio/AutoDJ/AiDjCadenceWatchdogSubscriber.php'
      - 'backend/src/Radio/AutoDJ/AiDjQueueListener.php'
      - 'backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php'
      - 'backend/src/Radio/AutoDJ/ClockWheelScheduler.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Playlists/Form/ScheduleRow.vue'
      - 'tests/Unit/AiDjClockWheelBridgeSubscriberTest.php'
      - '.github/workflows/ai-dj-airtime-regression.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php'
      - 'backend/src/Radio/AutoDJ/AiDjCadenceWatchdogSubscriber.php'
      - 'backend/src/Radio/AutoDJ/AiDjQueueListener.php'
      - 'backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php'
      - 'backend/src/Radio/AutoDJ/ClockWheelScheduler.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Playlists/Form/ScheduleRow.vue'
      - 'tests/Unit/AiDjClockWheelBridgeSubscriberTest.php'
      - '.github/workflows/ai-dj-airtime-regression.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate requested behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          # Listener requests keep first refusal (5). The bridge must then run
          # before ClockWheelScheduler (3), otherwise the wheel fills nextSongs
          # and the native AI DJ lifecycle/talk subscribers intentionally return.
          grep -q "BuildQueue::class => \['onBuildQueue', 4\]" backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php
          grep -q "\['buildFromClockWheel', 3\]" backend/src/Radio/AutoDJ/ClockWheelScheduler.php
          grep -q '\$this->cadenceWatchdog->onBuildQueue(\$event);' backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php
          grep -q '\$this->shiftLifecycle->onBuildQueue(\$event);' backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php
          grep -q '\$this->queueListener->onBuildQueue(\$event);' backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php

          # Keep the proven sign-on/sign-off and artist-info paths wired. The fix
          # restores their chance to run under Clock Wheel playback; it does not
          # replace them with a second generator or remove their safety guards.
          grep -q 'generateShiftIntro' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'AI DJ Welcome' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'generateShiftOutro' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q 'AI DJ Sign-off' backend/src/Radio/AutoDJ/AiDjShiftLifecycleListener.php
          grep -q 'AiDjArtistHistoryService' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'pushArtistHistoryClip' backend/src/Radio/AutoDJ/AiDjQueueListener.php

          # Requested playlist copy only; Repeat/Loop remains independent of
          # Flexible/Strict and its existing descriptions/behavior are preserved.
          grep -q 'Play once per scheduled block — No Loop' frontend/components/Stations/Playlists/Form/ScheduleRow.vue
          grep -q 'Repeat until end of block — Loop' frontend/components/Stations/Playlists/Form/ScheduleRow.vue
          grep -q 'Priority Start — Override Requests' frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          grep -q 'Start on schedule and take priority over listener requests' frontend/components/Stations/Playlists/Form/PlayoutRules.vue

      - name: PHP syntax check
        run: |
          php -l backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php
          php -l tests/Unit/AiDjClockWheelBridgeSubscriberTest.php

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute AI DJ ordering regression
        run: vendor/bin/codecept run tests/Unit/AiDjClockWheelBridgeSubscriberTest.php

      - name: PHPStan AI DJ bridge
        shell: bash
        run: |
          cat > phpstan.ai-dj-airtime.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.ai-dj-airtime.neon --memory-limit=-1 --no-progress \
            backend/src/Radio/AutoDJ/AiDjClockWheelBridgeSubscriber.php \
            tests/Unit/AiDjClockWheelBridgeSubscriberTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check playlist UI changes
        shell: bash
        run: |
          cat > tsconfig.ai-dj-airtime.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/Playlists/Form/PlayoutRules.vue",
              "frontend/components/Stations/Playlists/Form/ScheduleRow.vue"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.ai-dj-airtime.json --noEmit

      - name: Lint playlist UI changes
        run: >-
          npx eslint
          frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          frontend/components/Stations/Playlists/Form/ScheduleRow.vue
