name: TOH Runtime Validation

on:
  push:
    branches:
      - 'fix/toh-*'
      - dev
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/**TopOfHour**'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/**TopOfHour**'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate TOH architecture guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          test -f plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php

          grep -q 'TopOfHourCrossfadeConfiguration::class' plugins/top_of_hour/events.php
          grep -q "\['installHoldAwareCrossfade', 26\]" plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q "\['captureCrossSource', 24\]" plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php

          grep -q 'let azuracast.autodj_clean_cut_pending = ref(false)' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'def azuracast.discard_autodj_current_cleanly()' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'source.skip(azuracast.autodj_transport())' util/docker/stations/liquidsoap/azuracast.liq

          grep -q 'azuracast.autodj_fresh_hold = ref(false)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'fresh_hold_blank = blank()' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'fresh_hold_source = switch(' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q '({ not azuracast.autodj_fresh_hold() }, new.source)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'amplify(1.0, fresh_hold_source)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          ! grep -q 'def azuracast.hold_clean_cut_fresh_source(s)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.broadcast_clock_cross_source = radio' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php

          grep -q 'source.tracks(azuracast.broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.tracks(radio_before_top_of_hour)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current_cleanly_and_hold(hard_handoff_epoch)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.release_autodj_fresh_hold()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'server.execute("top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          grep -q 'boundary > 0.0 and now < boundary' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.autodj_hard_handoff_epoch()' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          grep -q 'consumed HARD TOH handoff; no second AutoDJ cut.' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php

          grep -q 'function deferUntil' backend/src/Event/Radio/ResolveQueueClockConstraint.php
          grep -q 'function shouldPersistDurationCap' backend/src/Event/Radio/ResolveQueueClockConstraint.php
          grep -q 'hasDeferral()' backend/src/Radio/AutoDJ/Queue.php
          grep -q 'shouldPersistDurationCap()' backend/src/Radio/AutoDJ/Queue.php
          grep -q 'Deferred AutoDJ projection past external broadcast-clock ownership.' backend/src/Radio/AutoDJ/Queue.php
          ! grep -q 'if (null !== \$event->getQueueRow())' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php

          grep -q 'getPlayedMusicHistoryByTimeRange' backend/src/Radio/AutoDJ/Queue.php
          grep -q '\$nextSongs\[0\]->song_id === \$lastSongId' backend/src/Radio/AutoDJ/Queue.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Liquidsoap 2.4.5 common-runtime parse
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint liquidsoap \
            -v "$PWD/util/docker/stations/liquidsoap:/liq:ro" \
            -w /liq savonet/liquidsoap:v2.4.5 --check azuracast.liq

      - name: Liquidsoap 2.4.5 PCM hold and callback override smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/toh-inline-hold-smoke.liq <<'EOF'
          init.daemon := false
          hold = ref(true)

          def callback(old, new) =
            new.source
          end

          def callback(old, new) =
            fresh_hold_blank = blank()
            fresh_hold_source = switch(
              track_sensitive=false,
              replay_metadata=true,
              transition_length=0.0,
              [({ not hold() }, new.source), ({ true }, fresh_hold_blank)]
            )
            amplify(1.0, fresh_hold_source)
          end

          music = sine(id="music", 880.)
          music = cross(id="typed_hold_cross", duration=1.0, callback, music)
          output.dummy(music)
          EOF
          docker run --rm --entrypoint liquidsoap \
            -v /tmp/toh-inline-hold-smoke.liq:/tmp/toh-inline-hold-smoke.liq:ro \
            savonet/liquidsoap:v2.4.5 --check /tmp/toh-inline-hold-smoke.liq

      - name: Install PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute TOH unit and incident regressions
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/codecept run tests/Unit/TopOfHourCrossfadeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourQueueClockConstraintTest.php

      - name: PHPStan TOH integration
        shell: bash
        run: |
          cat > phpstan.toph.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.toph.neon --memory-limit=-1 --no-progress \
            backend/src/Event/Radio/ResolveQueueClockConstraint.php \
            backend/src/Radio/AutoDJ/Queue.php \
            plugins/top_of_hour/events.php \
            plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php \
            plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php \
            plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php \
            plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php \
            tests/Unit/RigidScheduleRuntimeConfigurationTest.php \
            tests/Unit/TopOfHourCrossfadeConfigurationTest.php \
            tests/Unit/TopOfHourQueueClockConstraintTest.php \
            tests/Unit/TopOfHourRuntimeConfigurationTest.php
