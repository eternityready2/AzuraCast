name: TOH Runtime Validation

on:
  push:
    branches:
      - 'fix/toh-*'
      - 'feature/top-of-hour-plugin-rebuild'
      - dev
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/azuracast.liq'
      - 'backend/config/events.php'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/BroadcastClockPlannerTest.php'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - 'tests/Unit/TopOfHourClockTest.php'
      - 'tests/Unit/TopOfHourCrossfadeConfigurationTest.php'
      - 'tests/Unit/TopOfHourQueueClockConstraintTest.php'
      - 'tests/Unit/TopOfHourRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/azuracast.liq'
      - 'backend/config/events.php'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/**TopOfHour**'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate plugin ownership and single-authority handoff architecture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          test -f plugins/top_of_hour/events.php
          test -f plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          test -f backend/src/Event/Radio/ResolveQueueClockConstraint.php

          test ! -e backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          test ! -e backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          ! grep -q 'RigidScheduleRuntimeConfiguration' backend/config/events.php
          ! grep -q 'TopOfHourRuntimeConfiguration' backend/config/events.php

          grep -q 'StageTopOfHourStationIdTask' plugins/top_of_hour/events.php
          grep -q 'RigidScheduleRuntimeConfiguration::class' plugins/top_of_hour/events.php
          grep -q 'TopOfHourCrossfadeConfiguration::class' plugins/top_of_hour/events.php
          grep -q 'TopOfHourQueueClockConstraint::class' plugins/top_of_hour/events.php
          grep -q 'TopOfHourRuntimeConfiguration::class' plugins/top_of_hour/events.php

          # The failed quarantine/dummy-driver architectures stay gone.
          test ! -e plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          test ! -e plugins/top_of_hour/src/RetiredSongQueueGuard.php
          test ! -e backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          ! grep -q 'top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'server.execute("top_of_hour_cleanup_driver' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.skip(broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # Common runtime still owns the real request.dynamic transport and the
          # one-shot clean-cut marker. The plugin only changes what the forced
          # cross returns after old.source has been rejected.
          grep -q 'let azuracast.autodj_clean_cut_pending = ref(false)' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'def azuracast.discard_autodj_current_cleanly()' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'source.skip(azuracast.autodj_transport())' util/docker/stations/liquidsoap/azuracast.liq

          # Priority 26 installs the hold-aware callback before ConfigWriter's
          # priority-25 cross; priority 24 captures exactly that post-cross source.
          grep -q "\['installHoldAwareCrossfade', 26\]" plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q "\['captureCrossSource', 24\]" plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.autodj_fresh_hold = ref(false)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.autodj_hard_handoff_epoch = ref(0.0)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'def azuracast.discard_autodj_current_cleanly_and_hold(handoff_epoch)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.hold_clean_cut_fresh_source(new.source)' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php
          grep -q 'azuracast.broadcast_clock_cross_source = radio' plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php

          # TOH keeps #160 continuous cross activation, but it clocks only the
          # captured post-cross source and holds FRESH rather than consuming it.
          grep -q 'source.tracks(azuracast.broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.tracks(radio_before_top_of_hour)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current_cleanly_and_hold(hard_handoff_epoch)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.release_autodj_fresh_hold()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # HARD TOH remains authoritative through :00 and hands exactly one
          # AutoDJ retirement to a rigid source starting at that boundary.
          grep -q 'top_of_hour_hard_hold = blank' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q '\[top_of_hour_id, top_of_hour_hard_hold\]' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'boundary > 0.0 and now < boundary' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.autodj_hard_handoff_epoch()' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          grep -q 'consumed HARD TOH handoff; no second AutoDJ cut.' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current_cleanly()' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php

          # Queue projection reserves the ID interval without persisting tiny
          # durations/cue-outs into future music rows. Stale rows inside the
          # interval are deferred to resumeAt instead of being crammed into it.
          grep -q 'deferral' backend/src/Event/Radio/ResolveQueueClockConstraint.php || true
          grep -q 'function deferUntil' backend/src/Event/Radio/ResolveQueueClockConstraint.php
          grep -q 'function shouldPersistDurationCap' backend/src/Event/Radio/ResolveQueueClockConstraint.php
          grep -q 'hasDeferral()' backend/src/Radio/AutoDJ/Queue.php
          grep -q 'shouldPersistDurationCap()' backend/src/Radio/AutoDJ/Queue.php
          grep -q 'Deferred AutoDJ projection past external broadcast-clock ownership.' backend/src/Radio/AutoDJ/Queue.php
          grep -q "'top_of_hour_station_id'," plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          grep -q 'false,' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          ! grep -q 'if (null !== \$event->getQueueRow())' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          ! grep -q 'TopOfHourClock' backend/src/Radio/AutoDJ/Queue.php

          # Existing immediate-repeat protection remains intact.
          grep -q 'getPlayedMusicHistoryByTimeRange' backend/src/Radio/AutoDJ/Queue.php
          grep -q '\$nextSongs\[0\]->song_id === \$lastSongId' backend/src/Radio/AutoDJ/Queue.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Liquidsoap 2.4.5 common-runtime parse
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint liquidsoap \
            -v "$PWD/util/docker/stations/liquidsoap:/liq:ro" \
            -w /liq savonet/liquidsoap:v2.4.5 --check azuracast.liq

      - name: Liquidsoap 2.4.5 held-source switch smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/toh-held-source-smoke.liq <<'EOF'
          init.daemon := false
          hold = ref(true)
          fresh = sine(id="fresh", duration=2.0, 880.)

          def held(s) =
            hold_blank = blank()
            switch(
              track_sensitive=false,
              replay_metadata=true,
              transition_length=0.0,
              [({ not hold() }, s), ({ true }, hold_blank)]
            )
          end

          gated = held(fresh)
          output.dummy(gated)
          EOF
          docker run --rm --entrypoint liquidsoap \
            -v /tmp/toh-held-source-smoke.liq:/tmp/toh-held-source-smoke.liq:ro \
            savonet/liquidsoap:v2.4.5 --check /tmp/toh-held-source-smoke.liq

      - name: Install PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute TOH unit and live-incident regressions
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/codecept run tests/Unit/TopOfHourCrossfadeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourQueueClockConstraintTest.php

      - name: PHPStan TOH integration
        shell: bash
        run: |
          cat > phpstan.toph.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.toph.neon --memory-limit=-1 --no-progress \
            backend/src/Event/Radio/ResolveQueueClockConstraint.php \
            backend/src/Radio/AutoDJ/Queue.php \
            backend/src/Radio/AutoDJ/TopOfHour \
            plugins/top_of_hour/events.php \
            plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php \
            plugins/top_of_hour/src/TopOfHourCrossfadeConfiguration.php \
            plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php \
            plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php \
            tests/Unit/RigidScheduleRuntimeConfigurationTest.php \
            tests/Unit/TopOfHourClockTest.php \
            tests/Unit/TopOfHourCrossfadeConfigurationTest.php \
            tests/Unit/TopOfHourQueueClockConstraintTest.php \
            tests/Unit/TopOfHourRuntimeConfigurationTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check TOH frontend
        run: |
          cat > tsconfig.toph.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/TopOfHour.vue",
              "frontend/entities/TopOfHour.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.toph.json --noEmit

      - name: Lint TOH frontend
        run: npx eslint frontend/components/Stations/TopOfHour.vue frontend/entities/TopOfHour.ts
