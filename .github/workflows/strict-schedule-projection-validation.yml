name: Strict Schedule Projection Validation

on:
  push:
    branches:
      - 'fix/strict-schedule-*'
      - dev
    paths:
      - 'backend/src/Controller/Api/Stations/QueueController.php'
      - 'backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php'
      - 'backend/src/Radio/AutoDJ/LinearLogBuilder.php'
      - 'backend/src/Radio/AutoDJ/RigidScheduleWindowResolver.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Reports/LinearLog.vue'
      - 'frontend/components/Stations/Reports/LinearLogSchedule.vue'
      - 'frontend/functions/playlistBehaviorDetector.ts'
      - 'tests/Unit/RigidScheduleWindowResolverTest.php'
      - '.github/workflows/strict-schedule-projection-validation.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Controller/Api/Stations/QueueController.php'
      - 'backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php'
      - 'backend/src/Radio/AutoDJ/LinearLogBuilder.php'
      - 'backend/src/Radio/AutoDJ/RigidScheduleWindowResolver.php'
      - 'frontend/components/Stations/Playlists/Form/PlayoutRules.vue'
      - 'frontend/components/Stations/Reports/LinearLog.vue'
      - 'frontend/components/Stations/Reports/LinearLogSchedule.vue'
      - 'frontend/functions/playlistBehaviorDetector.ts'
      - 'tests/Unit/RigidScheduleWindowResolverTest.php'
      - '.github/workflows/strict-schedule-projection-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate diff and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          test -f backend/src/Radio/AutoDJ/RigidScheduleWindowResolver.php
          grep -q 'strict_start' frontend/functions/playlistBehaviorDetector.ts
          grep -q "MANUAL_BEHAVIOR_OPTION = 'manual_behavior'" frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          grep -q 'source_type.*scheduled_programme' backend/src/Radio/AutoDJ/LinearLogBuilder.php
          grep -q 'RigidScheduleWindowResolver' backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php
          grep -q 'RigidScheduleWindowResolver' backend/src/Controller/Api/Stations/QueueController.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute strict schedule regressions
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/codecept run tests/Unit/RigidScheduleWindowResolverTest.php
          vendor/bin/codecept run tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/FlexibleScheduleRuntimeConfigurationTest.php

      - name: PHPStan changed scheduling integration
        shell: bash
        run: |
          cat > phpstan.strict-schedule.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.strict-schedule.neon --memory-limit=-1 --no-progress \
            backend/src/Controller/Api/Stations/QueueController.php \
            backend/src/Entity/ApiGenerator/NowPlayingApiGenerator.php \
            backend/src/Radio/AutoDJ/LinearLogBuilder.php \
            backend/src/Radio/AutoDJ/RigidScheduleWindowResolver.php \
            tests/Unit/RigidScheduleWindowResolverTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check changed frontend
        shell: bash
        run: |
          cat > tsconfig.strict-schedule.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/Playlists/Form/PlayoutRules.vue",
              "frontend/components/Stations/Reports/LinearLog.vue",
              "frontend/components/Stations/Reports/LinearLogSchedule.vue",
              "frontend/functions/playlistBehaviorDetector.ts",
              "frontend/entities/LinearLog.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.strict-schedule.json --noEmit

      - name: Lint changed frontend
        run: >-
          npx eslint
          frontend/components/Stations/Playlists/Form/PlayoutRules.vue
          frontend/components/Stations/Reports/LinearLog.vue
          frontend/components/Stations/Reports/LinearLogSchedule.vue
          frontend/functions/playlistBehaviorDetector.ts
