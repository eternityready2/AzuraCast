name: Cancel Accidental Image Build
on:
  push:
    branches: [ main, dev ]

concurrency:
  group: build-custom-azuracast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-only:
    runs-on: ubuntu-latest
    steps:
      - name: No image push
        run: echo "Cancelling prior accidental image build; no container image is built or pushed."
