name: Build Custom AzuraCast
on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/eternityready2/azuracast_custom

jobs:
  # dev (:rolling) is amd64-only for fast builds. main no longer publishes an
  # image: installs use :stable, which only v* release tags publish.
  build:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Version File
        run: echo "$(git rev-parse --short HEAD)" > .version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          target: final
          tags: ${{ env.IMAGE }}:rolling
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # v* release tags publish :vX.Y.Z and :stable for amd64 and arm64, so ARM64
  # hosts (e.g. Oracle Ampere A1) pulling :stable get a multi-arch image. Each
  # architecture builds at the same time on its own native runner -- arm64
  # under QEMU emulation took about an hour -- and merge-release joins them.
  # arm64 keeps its own cache because the amd64 builds overwrite :buildcache.
  build-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            cache: buildcache
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildcache-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Version File
        run: echo "${{ github.ref_name }}" > .version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: final
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch :${{ github.ref_name }} and :stable
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.ref_name }}" \
            -t "${IMAGE}:stable" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ github.ref_name }}"
