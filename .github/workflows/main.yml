name: Build Custom AzuraCast
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Version File
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "${{ github.ref_name }}" > .version
          else
            echo "$(git rev-parse --short HEAD)" > .version
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every published image is multi-arch so ARM64 hosts (e.g. Oracle Ampere
      # A1) never receive an amd64-only image. Keep this in main AND dev.
      - name: Build and Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: final
          tags: |
            ghcr.io/eternityready2/azuracast_custom:${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'dev' && 'rolling' || github.ref_name }}
            ${{ (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')) && 'ghcr.io/eternityready2/azuracast_custom:stable' || '' }}
          cache-from: type=registry,ref=ghcr.io/eternityready2/azuracast_custom:buildcache
          cache-to: type=registry,ref=ghcr.io/eternityready2/azuracast_custom:buildcache,mode=max
